name: CI

# Build + test on every push to a branch and every PR. SecAudit targets Windows
# only (WPF + Windows-specific WMI/Registry interop), so we run exclusively on
# windows-latest. TreatWarningsAsErrors is already on in Directory.Build.props
# — that's our static-analysis gate; CodeQL is a separate workflow.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "assets/**"
  pull_request:
    branches: [main, master, CC]
  workflow_dispatch:

# Cancel in-flight runs of the same branch when a new push lands — saves Actions
# minutes during rapid iterations.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # Pinned via global.json (8.0.400); setup-dotnet honours that file.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SecAudit.sln

      - name: Build (Release, warnings-as-errors)
        # Directory.Build.props already enforces TreatWarningsAsErrors on src
        # projects, so any analyzer warning fails the build here.
        run: dotnet build SecAudit.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test SecAudit.sln
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  publish-smoke:
    name: Publish smoke (single-file)
    runs-on: windows-latest
    needs: build-test
    # Only run the publish smoke test on the integration branches — keeps
    # feature-branch CI under 5 minutes.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/CC'
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}

      - name: Publish WPF app (single-file portable)
        shell: pwsh
        run: ./build/publish-app.ps1

      - name: Publish CLI (single-file portable)
        shell: pwsh
        run: ./build/publish-cli.ps1

      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: secaudit-portable
          path: |
            out/**/SecAudit.exe
            out/**/SecAudit.Cli.exe
          if-no-files-found: error
          retention-days: 7
